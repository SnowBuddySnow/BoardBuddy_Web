name: Web CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Check
        run: pnpm run typecheck

      - name: Run ESLint
        run: pnpm run lint

      - name: Verify HTTP Contract
        run: pnpm run check:contracts

      - name: Build Web Application
        env:
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_JAVASCRIPT_KEY || 'dummy_ci_key' }}
          VITE_API_BASE_URL: /api
          VITE_BUILD_SHA: ${{ github.sha }}
        run: pnpm run build
      - name: Verify release metadata
        run: |
          jq --exit-status --arg revision "$GITHUB_SHA" '.revision == $revision' dist/build-info.json
          entry=$(jq --exit-status --raw-output '.entry' dist/build-info.json)
          test -f "dist${entry}"

  unit:
    name: Web Unit and Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      - name: Upload unit test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-unit-results
          path: output/test-results/

  browser-smoke:
    name: Synthetic Browser Journeys
    runs-on: ubuntu-latest
    # Test runner only; hosted web deployment remains Vercel.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile
      - name: Exercise event registration on desktop and mobile
        run: pnpm run test:browser
      - name: Exercise responsive signup and crew onboarding
        run: pnpm run test:onboarding
      - name: Exercise mobile management and season reservation lifecycle
        run: pnpm run test:management
      - name: Exercise season pass, stay consent and announcements
        run: pnpm run test:season-stays
      - name: Exercise notifications, organizer groups and crew discovery
        run: pnpm run test:notifications-groups
      - name: Save synthetic scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-evidence
          path: output/playwright/

  deploy-staging:
    name: Deploy and Verify Vercel Staging
    needs: [ verify, unit, browser-smoke ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging-web
      cancel-in-progress: false
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the current develop revision
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Develop advanced to ${latest}. Its workflow owns staging deployment."
          fi
      - name: Trigger Vercel Deploy Hook for develop
        if: steps.candidate.outputs.current == 'true'
        env:
          VERCEL_STAGING_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_STAGING_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_STAGING_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing secret VERCEL_STAGING_DEPLOY_HOOK_URL. Create a Vercel Deploy Hook for branch 'develop' and add it as a GitHub Actions secret (repository or 'staging' environment)."
            exit 1
          fi
          case "$VERCEL_STAGING_DEPLOY_HOOK_URL" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *)
              echo "::error::VERCEL_STAGING_DEPLOY_HOOK_URL must be a Vercel Deploy Hook URL (https://api.vercel.com/v1/integrations/deploy/...)."
              exit 1
              ;;
          esac
          response=$(curl -fsS -X POST "$VERCEL_STAGING_DEPLOY_HOOK_URL")
          job_id=$(printf '%s' "$response" | node -e "const d = JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.job?.id || '');")
          if [ -z "$job_id" ]; then
            echo "::error::Vercel Deploy Hook did not return a job ID."
            exit 1
          fi
          echo "Triggered Vercel staging deployment job: $job_id"
      - name: Verify the exact revision and built app on staging
        if: steps.candidate.outputs.current == 'true'
        run: node scripts/verify-staging.mjs

  verify-promotion:
    name: Verify Staging Revision for Production
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke-test the proposed production revision on staging
        env:
          BOARDBUDDY_STAGING_REVISION: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-staging.mjs
